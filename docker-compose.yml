services:
  flight-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flights
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flights"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - flight-db-data:/var/lib/postgresql/data

  booking-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookings
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookings"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - booking-db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  flight-service:
    build:
      context: ./flight-service
    environment:
      DATABASE_URL: "postgres://postgres:postgres@flight-db:5432/flights?sslmode=disable"
      GRPC_PORT: "50051"
      METRICS_PORT: "9100"
      REDIS_URL: "redis://redis:6379"
      API_KEY: "secret-key"
    ports:
      - "50051:50051"
      - "9100:9100"
    depends_on:
      flight-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  booking-service:
    build:
      context: ./booking-service
    environment:
      DATABASE_URL: "postgres://postgres:postgres@booking-db:5432/bookings?sslmode=disable"
      FLIGHT_SERVICE_URL: "flight-service:50051"
      API_KEY: "secret-key"
    ports:
      - "8000:8000"
    depends_on:
      booking-db:
        condition: service_healthy
      flight-service:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - booking-service
      - flight-service
      - flight-postgres-exporter
      - booking-postgres-exporter
      - redis-exporter

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  flight-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@flight-db:5432/flights?sslmode=disable"
    depends_on:
      flight-db:
        condition: service_healthy

  booking-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@booking-db:5432/bookings?sslmode=disable"
    depends_on:
      booking-db:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy

  load-tester:
    image: grafana/k6:0.55.0
    profiles: ["test"]
    environment:
      BOOKING_API_URL: "http://booking-service:8000"
    volumes:
      - ./load:/scripts:ro
      - ./load-results:/home/k6/load-results
    command: ["run", "/scripts/bookings.js"]
    depends_on:
      booking-service:
        condition: service_started

volumes:
  flight-db-data:
  booking-db-data:
