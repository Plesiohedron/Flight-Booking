name: CI

on:
  push:
  pull_request:

jobs:
  build-test-observe:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r booking-service/requirements.txt -r tests/requirements.txt pytest

      - name: Booking service unit tests
        working-directory: booking-service
        env:
          PYTHONPATH: ${{ github.workspace }}/booking-service
        run: pytest -q tests

      - name: Flight service unit tests
        working-directory: flight-service
        run: go test ./internal/cache

      - name: Build all services
        run: docker compose build

      - name: Start test environment
        run: docker compose up -d

      - name: Integration test
        run: python tests/integration_test.py

      - name: End-to-end test
        run: python tests/e2e_test.py

      - name: Validate Prometheus targets and metrics endpoints
        run: |
          curl --fail http://localhost:8000/metrics
          curl --fail http://localhost:9100/metrics
          curl --fail http://localhost:9090/-/ready

      - name: Load test
        run: |
          mkdir -p load-results
          docker compose --profile test run --rm load-tester

      - name: Health check after load
        run: curl --fail http://localhost:8000/health

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-results
          path: load-results/

      - name: Show docker logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop environment
        if: always()
        run: docker compose down -v
