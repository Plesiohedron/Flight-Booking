global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: booking-service
    metrics_path: /metrics
    static_configs:
      - targets: ["booking-service:8000"]

  - job_name: flight-service
    metrics_path: /metrics
    static_configs:
      - targets: ["flight-service:9100"]

  - job_name: flight-postgres
    static_configs:
      - targets: ["flight-postgres-exporter:9187"]

  - job_name: booking-postgres
    static_configs:
      - targets: ["booking-postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
